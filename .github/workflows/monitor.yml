name: Monitor Convocatorias ONPE

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual con un botón

permissions:
  contents: write

jobs:
  check-onpe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema y Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: |
          python scraper_onpe.py

      - name: Guardar historial en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_previo.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar estado_previo.json [skip ci]"
            git push
          fi
